name: Bug report
description: Report a reproducible problem with SpreadSignal.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, identifiable health information, or security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g., Safari 18 on iPhone
    validations:
      required: true
